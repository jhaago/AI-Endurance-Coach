name: Apps Script Bridge
on:
  push:
    branches: [feat/route-planner]
    paths:
      - "backend/**"
      - "scripts/apps_script_ci.mjs"
      - "scripts/apps_script_ci.test.mjs"
      - ".github/workflows/apps-script.yml"
      - "docs/APPS_SCRIPT_CI.md"
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect only, or deploy to the EXISTING web app
        type: choice
        required: true
        default: inspect
        options: [inspect, deploy]
      expected_remote_sha256:
        description: For deploy, copy the SHA256 from the latest inspection
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: endurance-coach-apps-script-production
  cancel-in-progress: false
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test backend
        run: node --test backend/test/*.test.cjs
      - name: Test deployment guards
        run: node --test scripts/apps_script_ci.test.mjs
  existing-web-app:
    needs: source-check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'inspect-bridge:') ||
      startsWith(github.event.head_commit.message, 'deploy-bridge:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify branch
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/feat/route-planner' ]; then
            echo "::error::Choose the feat/route-planner branch"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned clasp
        run: npm install --global @google/clasp@3.4.1
      - name: Inspect or redeploy existing Apps Script
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          APPS_SCRIPT_CLASPRC_JSON: ${{ secrets.APPS_SCRIPT_CLASPRC_JSON }}
          BRIDGE_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || (startsWith(github.event.head_commit.message, 'inspect-bridge:') && 'inspect' || 'deploy') }}
          BRIDGE_EXPECTED_REMOTE_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_remote_sha256 || github.event.head_commit.message }}
        run: node scripts/apps_script_ci.mjs
