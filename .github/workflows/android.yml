name: Android MVP
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify bridge
        run: node --test backend/test/*.test.cjs
      - name: Test, lint and build
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Check Android JSON API compatibility
        run: python3 scripts/check_android_json.py
      - uses: actions/upload-artifact@v4
        with:
          name: endurance-coach-debug
          path: app/build/outputs/apk/debug/app-debug.apk
