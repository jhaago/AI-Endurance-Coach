name: Android MVP
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify bridge
        run: node --test backend/test/*.test.cjs
      - name: Test and lint
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug
      - name: Build debug APK
        if: always()
        run: ./gradlew :app:assembleDebug
      - name: Check Android JSON API compatibility
        if: always()
        run: python3 scripts/check_android_json.py
      - name: Upload Android build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endurance-coach-0.6.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
  signed-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/feat/health-meals-preview' &&
       startsWith(github.event.head_commit.message, 'release:'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore persistent signing key
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Add the ANDROID_SIGNING_KEYSTORE_BASE64 Actions secret first."
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/endurance-coach.keystore"
          test -s "$RUNNER_TEMP/endurance-coach.keystore"
          echo "ENDURANCE_SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/endurance-coach.keystore" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          ENDURANCE_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ENDURANCE_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ENDURANCE_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: endurance-coach-0.6.1-signed
          path: app/build/outputs/apk/release/app-release.apk
