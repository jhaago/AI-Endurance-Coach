plugins { id 'com.android.application' }

def enduranceSigning = [
    keystorePath: System.getenv('ENDURANCE_SIGNING_KEYSTORE_PATH'),
    storePassword: System.getenv('ENDURANCE_SIGNING_STORE_PASSWORD'),
    keyAlias: System.getenv('ENDURANCE_SIGNING_KEY_ALIAS'),
    keyPassword: System.getenv('ENDURANCE_SIGNING_KEY_PASSWORD')
]
def enduranceSigningReady = enduranceSigning.values().every { it != null && !it.trim().isEmpty() }

gradle.taskGraph.whenReady { taskGraph ->
    boolean releaseRequested = taskGraph.allTasks.any {
        it.project.path == project.path && it.name.toLowerCase(Locale.ROOT).contains('release')
    }
    if (releaseRequested && !enduranceSigningReady) {
        throw new GradleException('Release signing is not configured. Add the documented ENDURANCE_SIGNING_* environment values.')
    }
}

android {
    namespace 'au.com.endurancecoach'
    compileSdk 35
    defaultConfig { applicationId 'au.com.endurancecoach'; minSdk 26; targetSdk 35; versionCode 13; versionName '0.6.1'; resValue 'string', 'app_name', 'Endurance Coach' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    testOptions { unitTests.includeAndroidResources = true }
    lint { abortOnError true }
    signingConfigs {
        release {
            if (enduranceSigningReady) {
                storeFile file(enduranceSigning.keystorePath)
                storePassword enduranceSigning.storePassword
                keyAlias enduranceSigning.keyAlias
                keyPassword enduranceSigning.keyPassword
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release }
    }
}
dependencies {
    implementation project(':core')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
